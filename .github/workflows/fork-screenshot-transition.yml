name: Fork screenshot transition evidence

on:
  push:
    branches: [perf/screenshot-startup-benchmark]
    paths:
      - .github/workflows/fork-screenshot-transition.yml
      - scripts/screenshot-transition-check/**

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: fork-screenshot-transition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.repository == 'dovidmoishe/Cap'
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Prepare output and validate local analysis
        run: |
          OUTPUT="$RUNNER_TEMP/screenshot-transition"
          echo "OUTPUT=$OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$OUTPUT/self-test" "$OUTPUT/runtime-download" "$OUTPUT/preflight"
          sw_vers > "$OUTPUT/os.txt"
          xcodebuild -version >> "$OUTPUT/os.txt"
          python3 -m pip install -r scripts/screenshot-transition-check/requirements.txt
          python3 scripts/screenshot-transition-check/test-analysis.py
      - name: Compile helpers without building Cap
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library -target arm64-apple-macosx15.0 \
            -framework AppKit -framework ScreenCaptureKit -framework CoreMedia -framework CoreVideo \
            scripts/screenshot-transition-check/recorder.swift -o "$OUTPUT/recorder" 2>&1 | tee "$OUTPUT/recorder-compile.log"
          xcrun swiftc -swift-version 5 -parse-as-library -target arm64-apple-macosx15.0 \
            -framework AppKit -framework ScreenCaptureKit scripts/screenshot-startup-benchmark/cap-fixture.swift \
            -o "$OUTPUT/cap-fixture" 2>&1 | tee "$OUTPUT/fixture-compile.log"
          xcrun swiftc -swift-version 5 -parse-as-library -target arm64-apple-macosx15.0 \
            -framework AppKit -framework Metal -framework QuartzCore -framework ScreenCaptureKit \
            scripts/screenshot-startup-benchmark/runner-probe.swift -o "$OUTPUT/preflight/runner-probe" 2>&1 | tee "$OUTPUT/probe-compile.log"
      - name: Verify graphics and recorder clock/color calibration before Cap
        run: |
          python3 scripts/screenshot-startup-benchmark/run-probe.py "$OUTPUT/preflight"
          "$OUTPUT/recorder" --self-test "$OUTPUT/self-test" > "$OUTPUT/self-test.log" 2>&1
          python3 scripts/screenshot-transition-check/analyze.py "$OUTPUT/self-test"
      - name: Download and verify the saved release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39426190700 --repo "$GITHUB_REPOSITORY" \
            --name cap-screenshot-runtime-macos-15 --dir "$OUTPUT/runtime-download"
          python3 scripts/screenshot-startup-benchmark/bundle-cap.py extract \
            "$OUTPUT/runtime-download/cap-screenshot-runtime.tar.gz" "$RUNNER_TEMP/transition-runtime" \
            --expected-run 39426190700
          test ! -e target/Frameworks
          test ! -e target/native-deps
      - name: Collect untimed revised preview-to-GPU evidence
        run: |
          python3 scripts/screenshot-transition-check/run.py "$OUTPUT" \
            --package "$RUNNER_TEMP/transition-runtime/package" \
            --fixture "$OUTPUT/cap-fixture" --recorder "$OUTPUT/recorder"
      - name: Retain all visual evidence and partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screenshot-transition-evidence-macos-15
          path: |
            ${{ runner.temp }}/screenshot-transition/**
            !${{ runner.temp }}/screenshot-transition/runtime-download/**
            !${{ runner.temp }}/screenshot-transition/recorder
            !${{ runner.temp }}/screenshot-transition/cap-fixture
            !${{ runner.temp }}/screenshot-transition/preflight/runner-probe
          retention-days: 7
          if-no-files-found: error
