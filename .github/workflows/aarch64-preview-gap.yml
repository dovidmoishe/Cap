name: aarch64 preview gap

on:
  workflow_dispatch:
  push:
    branches:
      - ci-debug/aarch64-preview-gap

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose NV12 preview gap
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUST_TARGET_TRIPLE: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Native deps
        run: node scripts/setup.js

      - name: Run gap diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 run --manifest-path apps/desktop-gpui/Cargo.toml --example aarch64-preview-gap-diagnostics --target aarch64-apple-darwin
          bin="apps/desktop-gpui/target/aarch64-apple-darwin/debug/examples/aarch64-preview-gap-diagnostics"
          echo "GAPDIAG binary=$bin"
          otool -L "$bin"
